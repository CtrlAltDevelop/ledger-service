# docker compose up --build
#   api      http://localhost:8000  (OpenAPI docs at /docs)
#   worker   publishes outbox events to the Redis stream "ledger.events"
#
# Create a client token once the stack is up:
#   docker compose exec api python manage.py create_api_client demo

x-app: &app
  build: .
  image: ledger-service:local
  environment:
    DATABASE_URL: postgres://ledger:ledger@postgres:5432/ledger
    DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-compose-only-not-a-real-key}
    DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,api}
    LEDGER_OUTBOX_PUBLISHER: redis
    REDIS_URL: redis://redis:6379/0
    WEB_CONCURRENCY: ${WEB_CONCURRENCY:-4}

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ledger
      POSTGRES_DB: ledger
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    <<: *app
    command: ["python", "manage.py", "migrate", "--noinput"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *app
    ports:
      - "${LEDGER_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    <<: *app
    command: ["python", "manage.py", "outbox_worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

volumes:
  pgdata:
